name: Regression checks
on: [push, pull_request]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run && python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: fantazmaty.test_settings
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-only
          MYSQL_DATABASE: fantazmaty_integration
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: fantazmaty.mysql_integration_settings
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: isolated-test-only
      - run: python manage.py collectstatic --noinput && python manage.py test core.test_audit_repairs
        env:
          DJANGO_SETTINGS_MODULE: fantazmaty.release_test_settings
