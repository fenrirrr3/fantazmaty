# Zadanie `plan` (tools/ci/affected.py) wybiera testy według zmienionych plików; pozostałe zadania
# czytają jego wyjścia w `if:`. Zadanie pominięte przez `if:` nie blokuje – to zamierzone.
# Pełna macierz SQLite i suita MySQL idą tylko przy zmianach bazy/ustawień, nierozpoznanych plikach,
# na harmonogramie (raz w tygodniu) i przy ręcznym uruchomieniu (workflow_dispatch).
name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'  # poniedziałek 4:23 UTC – siatka bezpieczeństwa: wszystko
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.plan.outputs.labels }}
      sqlite: ${{ steps.plan.outputs.sqlite }}
      mysql: ${{ steps.plan.outputs.mysql }}
      release: ${{ steps.plan.outputs.release }}
      css: ${{ steps.plan.outputs.css }}
      php: ${{ steps.plan.outputs.php }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      exclude_tags: ${{ steps.plan.outputs.exclude_tags }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # porównanie z bazą wymaga historii
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          # pull_request: baza PR-a; push: poprzedni stan gałęzi (zerowy SHA nowej gałęzi → pełna suita).
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "pull_request" ]; then
            python tools/ci/affected.py --base "$BASE" --github
          else
            python tools/ci/affected.py --all --github
          fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - run: ruff check .
      # Testy skryptu wyboru testów (czysty Python, bez Django).
      - run: python -m unittest tools.ci.test_affected
  css:
    needs: plan
    if: needs.plan.outputs.css == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Skale, warstwy i zakazy (!important, wartości spoza tokenów) – .stylelintrc.json.
      - run: npx --yes stylelint@16.10.0 "core/static/core/*.css"
  dependencies:
    needs: plan
    if: needs.plan.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit
      # pl_core_news_sm pochodzi z GitHuba i nie ma go w bazie PyPI.
      - run: grep -v '^pl_core_news_sm' requirements.txt > /tmp/audit-requirements.txt && pip-audit --strict -r /tmp/audit-requirements.txt
  php:
    needs: plan
    if: needs.plan.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Obraz ubuntu-latest ma PHP; instalacja tylko w razie braku.
      - run: command -v php >/dev/null || (sudo apt-get update && sudo apt-get install -y php-cli)
      - run: php tools/wordpress/test-snippets.php
  sqlite:
    needs: plan
    if: needs.plan.outputs.sqlite != 'none'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pełna suita na obu wersjach Pythona; wybrane pakiety tylko na 3.13.
        python: ${{ needs.plan.outputs.sqlite == 'full' && fromJSON('["3.12", "3.13"]') || fromJSON('["3.13"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: fantazmaty.test_settings
      - name: Testy (${{ needs.plan.outputs.sqlite == 'full' && 'pełna suita' || needs.plan.outputs.labels }})
        env:
          DJANGO_SETTINGS_MODULE: fantazmaty.test_settings
          LABELS: ${{ needs.plan.outputs.labels }}
          EXCLUDE_TAGS: ${{ needs.plan.outputs.exclude_tags }}
        run: |
          args=()
          for tag in $EXCLUDE_TAGS; do args+=(--exclude-tag "$tag"); done
          python manage.py test $LABELS "${args[@]}"
      # Kontrola wydania: collectstatic z manifestem (sprawdza url() w CSS i {% static %}) i strony bez DEBUG.
      - name: Kontrola wydania
        if: needs.plan.outputs.release == 'true' && matrix.python == '3.13'
        run: python manage.py collectstatic --noinput && python manage.py test core.tests.ui core.tests.texts core.tests.security
        env:
          DJANGO_SETTINGS_MODULE: fantazmaty.release_test_settings
  mysql:
    needs: plan
    if: needs.plan.outputs.mysql == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-only
          MYSQL_DATABASE: fantazmaty_integration
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: fantazmaty.mysql_integration_settings
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: isolated-test-only
