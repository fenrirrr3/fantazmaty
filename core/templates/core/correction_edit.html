{% extends "core/base.html" %}{% load static %}
{% block title %}Edytuj uwagę | Fantazmaty CMS{% endblock %}
{% block content %}<header class="page-header"><h1 class="page-title">Edytuj uwagę do antologii</h1></header>
<section class="details-card"><form method="post" class="intake-form" data-warn-unsaved>{% csrf_token %}{% edit_version %}<input type="hidden" name="version" value="{{ version }}">{{ form.as_p }}<button class="primary-button" type="submit">Zapisz</button> <a class="secondary-button" href="{% url 'core:anthology_corrections' %}">Anuluj</a></form></section>{% endblock %}
{% block scripts %}<script src="{% static 'core/corrections.js' %}"></script>{% endblock %}
