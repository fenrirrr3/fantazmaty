{% extends "core/base.html" %}
{% block title %}Edytuj notatkę | Fantazmaty CMS{% endblock %}
{% block content %}
<header class="page-header"><h1 class="page-title">Edytuj notatkę</h1><p>{{ text.title }}</p></header>
<section class="card"><form method="post" class="intake-form" data-warn-unsaved>{% csrf_token %}{{ form.as_p }}<button type="submit" class="primary-button">Zapisz</button> <a class="secondary-button" href="{% url 'core:assigned_text_detail' text.pk %}">Anuluj</a></form></section>
{% endblock %}
