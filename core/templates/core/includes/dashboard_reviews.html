<ul class="dashboard-list">{% for assignment in rows %}<li class="dashboard-list-item"><a class="detail-link" href="{% url 'core:assigned_review_detail' assignment.review_id %}"><strong>{{ assignment.review.title }}</strong></a><div class="muted-text">{{ assignment.review.anthology.title }}</div><p><span class="role-badge">{{ assignment.get_opinion_display|default:"Oczekuje na rozpoczęcie" }}</span></p><small class="muted-text">Od {{ assignment.assigned_at|date:"d.m.Y" }}</small></li>{% empty %}<li class="empty-results-panel">{{ empty_message }}</li>{% endfor %}</ul>
