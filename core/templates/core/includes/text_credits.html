{% if user.is_superuser %}
<details class="text-management-card" id="text-credits">
    <summary class="text-management-toggle"><span>Stopka tekstu</span><span class="dropdown-arrow" aria-hidden="true">▾</span></summary>
    <div class="text-management-content">
        <p>Uwzględnia wykonane prace, obecnych wykonawców, historię przekazań i oddane recenzje tego tekstu.</p>
        <ul class="credits-list">{% for row in text_credits %}<li><strong>{{ row.label }}:</strong> {{ row.names|join:", "|default:"–" }}</li>{% endfor %}</ul>
    </div>
</details>
{% endif %}
