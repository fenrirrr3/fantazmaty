<div class="email-copy" data-table-csv>
    <button type="button" class="header-search-toggle" data-table-csv-toggle aria-label="Kopiuj tabelę jako CSV" title="Kopiuj tabelę do schowka jako CSV – wszystkie strony, z bieżącym sortowaniem" aria-expanded="false" aria-controls="table-csv-panel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.5h18M9 9v11M15 9v11"/></svg>
    </button>
    <div id="table-csv-panel" class="email-copy-panel" data-header-panel hidden>
        <label for="table-csv-table">Tabela</label>
        <select id="table-csv-table" data-table-csv-table></select>
        <p>Cała tabela jako CSV (średnik, nagłówek w pierwszym wierszu): wszystkie strony, zgodnie z bieżącymi filtrami i sortowaniem, bez ukrytych kolumn.</p>
        <button type="button" class="primary-button" data-table-csv-run>Kopiuj CSV</button>
        <p role="status" aria-live="polite" data-table-csv-status></p>
        <textarea data-table-csv-result aria-label="Tabela CSV do skopiowania" rows="4" readonly hidden></textarea>
    </div>
</div>
