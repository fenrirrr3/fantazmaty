{# Pole formularza Django: etykieta, błędy, kontrolka i podpowiedź (identyfikator podpowiedzi pasuje do aria-describedby Django). #}
<div class="form-field">{{ field.label_tag }}{{ field.errors }}{{ field }}{% if field.help_text %}<p class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}</div>
