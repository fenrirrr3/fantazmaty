<form method="get" class="filters-form"><div class="filter-field"><label for="role">Rola</label><select id="role" name="role" required><option value="">Wybierz rolę</option>{% for role in roles %}<option value="{{ role.pk }}"{% if role.pk|stringformat:'s' == selected_role %} selected{% endif %}>{{ role.name }}</option>{% endfor %}</select></div><button type="submit" class="primary-button">Generuj listę</button></form>
{% if chosen_role %}<h2>{{ chosen_role.name }}</h2><p class="role-names">{% if names %}{{ names|join:", " }}{% else %}Brak aktywnych osób z tą rolą.{% endif %}</p>{% endif %}
